name: Deploy prototype artifacts to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "prototypes/**"
      - ".github/workflows/deploy-prototypes.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage only public prototypes
        run: |
          mkdir -p _site
          cp -R prototypes/. _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - id: deployment
        uses: actions/deploy-pages@v4
